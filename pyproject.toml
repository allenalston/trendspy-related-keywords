[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "trendspy-related-keywords"
version = "0.2.0"
description = "An open-source Google Trends rising related keywords monitor with deduplication, resume support, and daily digest reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "allenalston" },
]
keywords = ["google-trends", "seo", "keywords", "trendspy", "monitoring", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "trendspy>=0.1.6",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/allenalston/trendspy-related-keywords"
Repository = "https://github.com/allenalston/trendspy-related-keywords"
Issues = "https://github.com/allenalston/trendspy-related-keywords/issues"

[project.scripts]
trends-monitor = "trends_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trends_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
