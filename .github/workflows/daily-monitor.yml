name: Daily Google Trends Monitor

# Fork this repository, commit your own `config.yaml` (or use `config.example.yaml`),
# add optional Secrets (TRENDS_SMTP_*, TRENDS_FEISHU_WEBHOOK, etc.), and enable Actions.
# SQLite history is automatically restored and persisted between daily runs via Actions Cache
# so cross-day "New" deduplication works without a dedicated server.

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "Optional space-separated keywords override (leave empty to use config)"
        required: false
        default: ""
  schedule:
    # Runs daily at 01:00 UTC (09:00 UTC+8)
    - cron: "0 1 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trends-monitor
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Restore SQLite deduplication history
        uses: actions/cache/restore@v4
        with:
          path: data/trends_history.sqlite3
          key: trends-history-${{ github.run_id }}
          restore-keys: |
            trends-history-

      - name: Prepare config
        run: |
          if [ ! -f config.yaml ]; then
            cp config.example.yaml config.yaml
          fi

      - name: Run Trends Monitor
        env:
          TRENDS_PROXY: ${{ secrets.TRENDS_PROXY }}
          TRENDS_SMTP_SERVER: ${{ secrets.TRENDS_SMTP_SERVER }}
          TRENDS_SMTP_PORT: ${{ secrets.TRENDS_SMTP_PORT }}
          TRENDS_SENDER_EMAIL: ${{ secrets.TRENDS_SENDER_EMAIL }}
          TRENDS_SENDER_PASSWORD: ${{ secrets.TRENDS_SENDER_PASSWORD }}
          TRENDS_RECIPIENT_EMAIL: ${{ secrets.TRENDS_RECIPIENT_EMAIL }}
          TRENDS_FEISHU_WEBHOOK: ${{ secrets.TRENDS_FEISHU_WEBHOOK }}
          TRENDS_WECOM_WEBHOOK: ${{ secrets.TRENDS_WECOM_WEBHOOK }}
          TRENDS_WEBHOOK_URL: ${{ secrets.TRENDS_WEBHOOK_URL }}
        run: |
          if [ -n "${{ github.event.inputs.keywords }}" ]; then
            ARGS=""
            for kw in ${{ github.event.inputs.keywords }}; do
              ARGS="$ARGS -k $kw"
            done
            trends-monitor run $ARGS
          else
            trends-monitor run
          fi

      - name: Save updated SQLite deduplication history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/trends_history.sqlite3
          key: trends-history-${{ github.run_id }}

      - name: Upload daily report & database snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trends-digest-${{ github.run_id }}
          path: data/
          retention-days: 30
